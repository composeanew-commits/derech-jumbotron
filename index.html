<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Derech Jumbotron</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Rubik:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>

  :root{

    --bg:#0E0C1B;

    --panel:#161331;

    --panel2:#1C1840;

    --purple:#4C447E;

    --purple-light:#8B82C9;

    --gold:#F0B84D;

    --gold-dim:#8a672a;

    --ink:#EDEAF7;

    --muted:#8A84B0;

    --line:#2A2555;

    --red:#D6503F;

    --blue:#3E7CB1;

    --green:#4E9B5C;

    --pink:#D673A8;

  }

  *{box-sizing:border-box;}

  html,body{

    margin:0;height:100%;

    background:radial-gradient(ellipse at 50% -10%, #241f4a 0%, var(--bg) 55%);

    color:var(--ink);font-family:'Rubik',sans-serif;overflow:hidden;

  }

  body::before{

    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;

    background:radial-gradient(circle at 15% 85%, rgba(139,130,201,.10) 0%, transparent 45%),

               radial-gradient(circle at 85% 20%, rgba(240,184,77,.06) 0%, transparent 40%);

    animation:ambientBreathe 12s ease-in-out infinite;

  }

  @keyframes ambientBreathe{0%,100%{opacity:.7;}50%{opacity:1;}}

  .display{height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}



  header{

    display:flex;align-items:center;justify-content:space-between;

    padding:20px 40px 14px 40px;border-bottom:1px solid var(--line);position:relative;

    /* The header has no fixed height — it grows to fit the countdown strip

       when several countdowns wrap onto extra rows. Without flex-shrink:0

       here, the outer column layout (header + main + ticker, all fixed to

       100vh) was free to compress the header BELOW that content height

       once there wasn't room for everything — which doesn't shrink the

       countdown chips gracefully, it just overlaps and crushes their text.

       Pinning the header to its natural size means the squeeze always

       lands on `main` instead, which already shrinks safely (its panels

       resize with object-fit, nothing there depends on text fitting a

       fixed box). */

    flex-shrink:0;

  }

  header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;

    background:linear-gradient(90deg, var(--gold), var(--pink), var(--blue), var(--purple-light), var(--gold));

    background-size:300% 100%;animation:headerFlow 10s linear infinite;opacity:.85;}

  @keyframes headerFlow{0%{background-position:0% 0;}100%{background-position:300% 0;}}

  .brand{display:flex;align-items:center;gap:18px;}

  /* A soft rotating glow sits behind the logo plate — same trick as the

     header's flowing gradient line, just contained to a circle so it reads

     as a subtle "beacon" rather than a distraction. */

  .logoPlateWrap{position:relative;display:flex;align-items:center;justify-content:center;}

  .logoPlateWrap::before{content:'';position:absolute;inset:-6px;border-radius:16px;

    background:conic-gradient(from 0deg, var(--gold), var(--pink), var(--purple-light), var(--blue), var(--gold));

    filter:blur(9px);opacity:.55;animation:logoGlow 6s linear infinite;z-index:0;}

  @keyframes logoGlow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .logoPlate{position:relative;z-index:1;background:#F4F1E8;border-radius:12px;padding:8px 14px;display:flex;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);}

  .brand img{height:44px;width:auto;display:block;}

  .brandText{display:flex;flex-direction:column;}

  .brandText .name{font-family:'Poppins',sans-serif;font-weight:900;font-size:27px;letter-spacing:1px;

    background:linear-gradient(90deg, var(--gold), var(--pink) 35%, var(--purple-light) 70%, var(--gold));

    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;

    animation:headerFlow 10s linear infinite;}

  .brandText .sub{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}

  .brandText .sub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(78,155,92,.6);animation:pulseDot 2s infinite;}

  .headerRight{display:flex;gap:24px;align-items:center;font-family:'JetBrains Mono',monospace;}

  .dayBadge{background:var(--panel2);border:1px solid var(--line);padding:8px 16px;border-radius:6px;font-size:13px;color:var(--gold);letter-spacing:1px;}

  .clock{font-family:'Rubik',sans-serif;font-weight:700;font-size:22px;color:var(--ink);letter-spacing:.5px;}



  main{flex:1;display:flex;align-items:stretch;justify-content:center;gap:24px;padding:18px 36px;position:relative;min-height:0;}

  /* Narrow sidebar: countdown strip (compact, top) + one rotating spotlight

     card filling the rest. Deliberately sized well below the photo panel so

     flyers/photos stay the clear focal point of the screen. */

  .mainPanel{flex:0.55;min-width:0;position:relative;display:flex;flex-direction:column;gap:14px;min-height:0;}



  /* Photo mosaic: hero photo + 3 smaller ones, all independently rotating.

     This is the dominant element on screen — the flyer gets its own panel,

     entirely separate from the smaller photo column beside it. */

  .flyerPanel{flex:2.75;min-width:0;position:relative;display:flex;flex-direction:row;gap:12px;}

  /* When two flyers are both landscape/horizontal, stacking them on top of

     each other (instead of side by side) makes far better use of the

     central space — a wide landscape image gets to be wide instead of

     being squeezed into a narrow vertical sliver. Toggled via JS once each

     flyer's real image dimensions are known (see updateFlyerPanelLayout). */

  .flyerPanel.stacked{flex-direction:column;}

  /* Triple layout: a portrait flyer takes one full-height side, and the

     space that a single landscape flyer would otherwise leave half-empty

     next to it instead holds two landscape flyers stacked on top of each

     other. */

  .flyerStackWrap{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;}

  .flyerCell{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel2);box-shadow:0 0 40px rgba(0,0,0,.25);transition:opacity .38s ease;}

  .flyerCell.fadeOut{opacity:0;}

  /* Flyers must always be shown in full — never cropped — no matter if the

     upload is portrait or landscape. */

  .flyerCell img{width:100%;height:100%;object-fit:contain;background:#0E0C1B;display:block;}

  /* Multi-page PDF flyers render into this canvas instead of an <img> — same

     fill/contain sizing so a PDF page looks identical to a normal flyer

     image, just flipping between pages on its own timer (see

     initFlyerPdfCell). */

  .flyerCell canvas.flyerPdfCanvas{width:100%;height:100%;object-fit:contain;background:#0E0C1B;display:block;}

  .flyerPdfPageIndicator{position:absolute;bottom:10px;right:10px;z-index:2;

    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;

    color:var(--ink);background:rgba(14,12,27,.72);padding:4px 11px;border-radius:12px;

    border:1px solid var(--line);}

  .flyerCell .flyerEventName{font-size:20px;}

  .flyerCell .flyerWhen{font-size:14px;}

  .flyerCell .flyerCaptionBar{padding:34px 20px 14px 20px;}

  /* Badge burned onto a Need to Know flyer so it reads as important at a

     glance, even mid-rotation, before anyone's actually read the text.

     Understated on purpose — a translucent dark pill with a thin gold

     hairline and the same slow-moving gold/pink sheen used on the brand

     name up in the header, rather than a loud solid-gold sticker. */

  .flyerNeedToKnowBadge{position:absolute;top:18px;left:18px;z-index:2;

    display:inline-flex;align-items:center;gap:9px;

    font-family:'Poppins',sans-serif;font-weight:800;font-size:12px;letter-spacing:2.5px;

    text-transform:uppercase;padding:10px 20px;border-radius:999px;

    background:rgba(14,12,27,.78);border:1px solid rgba(240,184,77,.55);

    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

    box-shadow:0 4px 18px rgba(0,0,0,.4), 0 0 0 1px rgba(240,184,77,.08);

    animation:ntkBadgePulse 2.4s ease-in-out infinite;}

  .flyerNeedToKnowBadge::before{content:'\2726';font-size:12px;color:var(--gold);flex-shrink:0;animation:ntkStarSpin 5s linear infinite;display:inline-block;}

  @keyframes ntkStarSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  @keyframes ntkBadgePulse{0%,100%{box-shadow:0 4px 18px rgba(0,0,0,.4), 0 0 0 1px rgba(240,184,77,.08);}50%{box-shadow:0 4px 24px rgba(0,0,0,.45), 0 0 0 5px rgba(240,184,77,.14);}}

  .flyerNeedToKnowBadgeText{background:linear-gradient(90deg, var(--gold), var(--pink) 50%, var(--gold));

    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;

    animation:headerFlow 7s linear infinite;}

  /* The badge alone is easy to miss on a big shared screen from a distance,

     so a Need to Know flyer also gets a slow-breathing gold hairline around

     its entire cell \u2014 unmissable peripherally, still calm enough not to

     look like an error state. */

  .flyerCell.flyerCellNeedToKnow{animation:ntkFramePulse 3.2s ease-in-out infinite;}

  @keyframes ntkFramePulse{0%,100%{box-shadow:0 0 0 2px rgba(240,184,77,.35), 0 0 30px rgba(240,184,77,.12);}50%{box-shadow:0 0 0 2px rgba(240,184,77,.75), 0 0 46px rgba(240,184,77,.28);}}



  /* Photos are the smaller, separate "nice to look at" column — a stack of

     a couple of cells, each still a real size, never squeezed into slivers. */

  .photoPanel{flex:0.8;min-width:0;display:flex;flex-direction:column;gap:6px;}

  .photoCell{flex:1;min-width:0;position:relative;overflow:hidden;background:#0E0C1B;border-radius:16px;border:1px solid var(--line);transition:opacity .38s ease, flex-grow .45s ease;}

  .photoCell.tall{flex-grow:2;}

  .photoCell.fadeOut{opacity:0;}

  .photoCell img{width:100%;height:100%;object-fit:contain;display:block;}

  .photoCell video{width:100%;height:100%;object-fit:contain;display:block;background:#0E0C1B;}

  .photoCell .photoPanelLabel{position:absolute;top:8px;left:8px;z-index:2;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);background:rgba(14,12,27,.7);padding:4px 9px;border-radius:14px;}

  .photoCell .photoPanelLabel.photoPanelLabelNew{color:#0E0C1B;background:var(--gold);font-weight:700;animation:badgePulse 1.7s ease-in-out infinite;}

  .photoCell .photoCaptionBar{position:absolute;bottom:0;left:0;right:0;padding:18px 10px 8px 10px;background:linear-gradient(transparent, rgba(6,4,16,.88));font-size:11px;color:var(--ink);line-height:1.3;}

  .photoEmptyState{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-family:'Rubik';padding:16px;text-align:center;font-size:13px;}

  @keyframes badgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}



  .flyerCaptionBar{padding:22px 12px 10px 12px;}

  .flyerEventName{font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:var(--ink);line-height:1.25;}

  .flyerWhen{margin-top:4px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}

  .flyerWhen.urgency-today{color:#ff8a75;}

  .flyerWhen.urgency-later{color:var(--purple-light);}



  /* Compact, energizing countdown strip — every active countdown gets a

     chip; chips widen to fit their own text (short name = narrow chip,

     long name = wider chip) instead of wrapping the text onto extra

     lines, so the strip only ever grows sideways/into new rows, never

     taller per chip. flex:0 0 auto pins each chip to that natural width —

     no shrinking, which is what used to let a chip get squeezed narrower

     than its text and force a wrap. */

  .countdownStrip{flex:1;min-width:0;display:none;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin:0 24px;}

  .countdownStrip.active{display:flex;}

  .countdownChip{flex:0 0 auto;min-width:130px;max-width:520px;background:linear-gradient(135deg, rgba(240,184,77,.16), rgba(139,130,201,.12));border:1px solid var(--gold-dim);border-radius:12px;padding:10px 16px;display:flex;flex-direction:row;align-items:center;justify-content:center;text-align:left;gap:12px;position:relative;overflow:hidden;animation:heroGlow 3.5s ease-in-out infinite;transition:border-color .5s ease, background .5s ease;}

  /* When several countdowns are active at once, trim padding/type size a

     touch so more chips fit per row without the strip taking over the

     whole sidebar. Two tiers: "compact" once there are more than a

     handful, and a tighter "dense" tier once there are enough that even

     compact chips would stack into many rows — each step trims size

     further, but never below what's still comfortably readable on a

     kiosk screen. Shrinking the font here also naturally narrows each

     chip (since width now tracks the text), so there's no separate width

     rule needed for these tiers.  */

  .countdownStrip.compact .countdownChip{padding:8px 12px;}

  .countdownStrip.compact .countdownChipName{font-size:11px;line-height:1.15;}

  .countdownStrip.compact .countdownChipFlips .flipUnit{padding:4px 6px;min-width:30px;}

  .countdownStrip.compact .countdownChipFlips .flipNum{font-size:15px;}

  .countdownStrip.dense{gap:6px;}

  .countdownStrip.dense .countdownChip{padding:6px 10px;min-width:110px;gap:8px;}

  .countdownStrip.dense .countdownChipName{font-size:10px;line-height:1.1;}

  .countdownStrip.dense .countdownChipFlips{gap:4px;}

  .countdownStrip.dense .countdownChipFlips .flipUnit{padding:3px 5px;min-width:24px;}

  .countdownStrip.dense .countdownChipFlips .flipNum{font-size:13px;}

  .countdownStrip.dense .countdownChipFlips .flipLabel{font-size:6px;}

  .countdownChip::before{content:'';position:absolute;inset:-70%;background:radial-gradient(circle, rgba(240,184,77,.18), transparent 60%);animation:heroSpin 9s linear infinite;pointer-events:none;}

  @keyframes heroGlow{0%,100%{box-shadow:0 0 16px rgba(240,184,77,.10);}50%{box-shadow:0 0 30px rgba(240,184,77,.30);}}

  @keyframes heroSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  /* Urgency tiers: events happening today pulse hot and red so they're

     unmissable; the default gold glow covers "soon" (within 3 days); further

     out settles into a calmer purple \u2014 the chip visibly heats up as the

     event approaches. */

  .countdownChip.urgency-today{border-color:var(--red);background:linear-gradient(135deg, rgba(214,80,63,.24), rgba(240,184,77,.14));animation:heroGlowHot 1.7s ease-in-out infinite;}

  .countdownChip.urgency-today::before{background:radial-gradient(circle, rgba(214,80,63,.22), transparent 60%);animation-duration:5s;}

  @keyframes heroGlowHot{0%,100%{box-shadow:0 0 18px rgba(214,80,63,.25);}50%{box-shadow:0 0 36px rgba(214,80,63,.55);}}

  .countdownChip.urgency-later{border-color:var(--purple);background:linear-gradient(135deg, rgba(139,130,201,.16), rgba(76,68,126,.12));animation:heroGlow 5.5s ease-in-out infinite;}

  .todayTag{display:inline-block;background:var(--red);color:#fff;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:8px;margin-right:6px;vertical-align:middle;}

  .countdownChipName{position:relative;z-index:1;font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;text-align:center;}

  .countdownChipFlips{position:relative;z-index:1;display:flex;gap:6px;flex-shrink:0;justify-content:center;}

  .countdownChipFlips .flipUnit{padding:6px 8px;min-width:36px;background:rgba(14,12,27,.55);border-radius:8px;border:1px solid var(--line);text-align:center;}

  .countdownChipFlips .flipNum{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--gold);line-height:1;}

  .countdownChipFlips .flipLabel{font-size:7px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:2px;}



  /* Single rotating spotlight card, fills the rest of the sidebar below the

     countdown strip. Fixed to the available height \u2014 nothing here ever

     needs to scroll. Each content type sets --accent (see buildSpotlightItems)

     so the eyebrow, dots, border, and progress bar all shift color with it \u2014

     a quick visual cue for what kind of thing is on screen right now. */

  /* Sidebar now shows 2-3 of these stacked at once instead of one card

     rotating through everything one at a time \u2014 each slot rotates

     independently on its own timer, so several different pieces of content

     (zmanim, a shoutout, trivia...) are visible simultaneously. */

  .spotlightGrid{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;}

  /* A very faint accent-tinted wash in the top corner gives each card type

     its own "color temperature" at a glance, on top of the border/eyebrow

     cue that already existed \u2014 subtle enough not to fight the content,

     but enough that trivia (red), a word (blue), a thought (green) etc.

     each feel like a distinct little moment rather than identical boxes. */

  .bigCard{--accent:var(--gold);flex:1;min-height:0;overflow:hidden;position:relative;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:14px 16px 12px 14px;display:flex;flex-direction:column;transition:border-color .4s ease, box-shadow .4s ease;box-shadow:0 6px 22px rgba(0,0,0,.18);}

  /* The Zmanim/Schedule card (slot 0) keeps its original larger share of the

     sidebar — it was sized for a 3-card grid, and adding the dedicated

     Halacha card as a 4th would otherwise have shrunk it along with

     everything else. The three cards below it (Halacha, and the two

     general-rotation slots) split the remaining space evenly among

     themselves, each smaller than before. */

  #spotlightCard0{flex:2.2;}

  .bigCard::before{content:'';position:absolute;top:0;right:0;width:130px;height:130px;background:radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);pointer-events:none;transition:background .4s ease;}

  .bigCard .widgetTitle{flex-shrink:0;}

  .bigCard .cardScroll{flex:1;min-height:0;overflow:hidden;position:relative;}

  .bigCard .cardScroll::after{content:'';position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(transparent, var(--panel2));pointer-events:none;}

  .spotlightCard{animation:widgetFadeIn .5s ease both;}

  @keyframes widgetFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}



  /* Thin progress bar fills over the exact dwell time of that slot's current

     slide \u2014 a small constant reminder that the board is always mid-motion. */

  .spotlightMeta{flex-shrink:0;margin-top:8px;}

  .spotlightProgress{height:2px;background:var(--line);border-radius:2px;overflow:hidden;}

  .spotlightProgressFill{height:100%;width:0%;background:var(--accent);border-radius:2px;animation-name:spotlightFill;animation-timing-function:linear;animation-fill-mode:forwards;}

  @keyframes spotlightFill{from{width:0%;}to{width:100%;}}



  .widgetEyebrow{font-family:'JetBrains Mono',monospace;color:var(--accent);letter-spacing:1.5px;font-size:9px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-shrink:0;transition:color .4s ease;position:relative;z-index:1;}
